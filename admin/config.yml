backend:
  name: github
  repo: pencoret/pencoret
  branch: main
  base_url: https://pencoret.web.id
  auth_endpoint: auth
collections:
  - name: "post"
    label: "Artikel Blog"
    folder: "content/post"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Foto Utama", name: "thumbnail", widget: "image", required: false }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }
