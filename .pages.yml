media:
  input: static/images
  output: /images

content:
  - name: blog
    label: Artikel Blog
    type: collection
    path: content/blog
    filename: "{fields.slug}.md"
    view:
      fields: [ title, slug, date, categories, populer, pilihan ]
    fields:
      - name: title
        label: Judul Artikel (H1)
        type: string
        required: true
        description: "Judul lengkap yang tampil di bagian atas halaman artikel"
      - name: seo_title
        label: Judul SEO (Title Tag)
        type: string
        required: false
        description: "Opsional. Ideal 50-60 karakter untuk tampilan di Google. Jika kosong, otomatis pakai Judul Artikel"
      - name: slug
        label: Permalink / Slug (URL)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Gunakan huruf kecil dan tanda hubung saja tanpa spasi (contoh: menu-harian-ferritin-face)"
      - name: date
        label: Tanggal
        type: date
        required: true
      - name: author
        label: Penulis
        type: string
        default: PenCoret
      - name: description
        label: Meta Description (Deskripsi Singkat SEO)
        type: text
        description: "Ringkasan artikel untuk hasil pencarian Google (ideal 120-155 karakter)"
      - name: categories
        label: Kategori
        type: select
        options:
          multiple: true
          values:
            - Viral & Tren
            - Fakta Unik
            - Teknologi & Digital
            - Gaya Hidup
            - Bisnis & Cuan
            - Opini & Cerita
      - name: populer
        label: Tampilkan di Slider Populer (Utama)
        type: boolean
        default: false
      - name: pilihan
        label: Tampilkan di Kotak Postingan Pilihan
        type: boolean
        default: false
      - name: tags
        label: Tags
        type: string
        list: true
      - name: banner
        label: Foto Utama
        type: image
      - name: banner_alt
        label: Alt Text Foto Utama (SEO)
        type: string
        description: "Deskripsi singkat isi gambar untuk SEO Google Images dan pembaca layar"
      - name: banner_caption
        label: Keterangan / Sumber Foto Utama
        type: string
      - name: body
        label: Isi Artikel
        type: rich-text
