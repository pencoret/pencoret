media:
  input: static/images
  output: /images

content:
  - name: blog
    label: Artikel Blog
    type: collection
    path: content/blog
    view:
      fields: [ title, date, categories ]
    fields:
      - name: title
        label: Judul
        type: string
        required: true
      - name: date
        label: Tanggal
        type: date
        required: true
      - name: description
        label: Deskripsi Singkat
        type: text
      - name: categories
        label: Kategori
        type: select
        options:
          multiple: true
          values:
            - Viral & Tren
            - Fakta Unik
            - Teknologi & Digital
            - Gaya Hidup
            - Bisnis & Cuan
            - Opini & Cerita
      - name: tags
        label: Tags
        type: string
        list: true
      - name: banner
        label: Foto Utama
        type: image
      - name: body
        label: Isi Artikel
        type: rich-text
