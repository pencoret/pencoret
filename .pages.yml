media:
  input: static/images
  output: /images

content:
  - name: blog
    label: Artikel Blog
    type: collection
    path: content/blog
    filename: "{primary}.md"
    view:
      fields: [ title, date, categories, populer, pilihan ]
    fields:
      - name: title
        label: Judul
        type: string
        required: true
      - name: date
        label: Tanggal
        type: date
        required: true
      - name: author
        label: Penulis
        type: string
        default: PenCoret
      - name: description
        label: Deskripsi Singkat
        type: text
      - name: categories
        label: Kategori
        type: select
        options:
          multiple: true
          values:
            - Viral & Tren
            - Fakta Unik
            - Teknologi & Digital
            - Gaya Hidup
            - Bisnis & Cuan
            - Opini & Cerita
      - name: populer
        label: Tampilkan di Slider Populer (Utama)
        type: boolean
        default: false
      - name: pilihan
        label: Tampilkan di Kotak Postingan Pilihan
        type: boolean
        default: false
      - name: tags
        label: Tags
        type: string
        list: true
      - name: banner
        label: Foto Utama
        type: image
      - name: banner_caption
        label: Keterangan / Sumber Foto Utama
        type: string
      - name: body
        label: Isi Artikel
        type: rich-text
