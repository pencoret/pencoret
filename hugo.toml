baseURL = 'https://pencoret.web.id'
languageCode = 'id-id'
title = 'PenCoret'
theme = 'mainroad'
summaryLength = 35
enableRobotsTXT = true
timeZone = 'Asia/Jakarta'

[sitemap]
  changefreq = 'hourly'
  filename = 'sitemap.xml'
  priority = 0.8

[permalinks]
  blog = '/:slug/'

[imaging]
  quality = 85
  resampleFilter = 'lanczos'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[Params]
  customCSS = ["css/custom.css"]
  customJS = ["js/custom.js"]
  description = 'Ruang Baca Terkini, Tren Viral dan Fakta Unik'
  keywords = ['berita terkini', 'tren viral', 'fakta unik', 'teknologi', 'hiburan', 'olahraga']
  copyright = 'PenCoret'
  style = 'default'
  mainSections = ['blog']
  date_format = '02 January 2006'
  logo = '/images/image_b36997e3.jpeg'
  logo_small = '/images/image_b36997e3.jpeg'
  favicon = 'favicon.png'
  images = ['/images/image_d634cfff.jpg']
  opengraph = true
  twitter_cards = true
  schema = true
  post_meta = ['author', 'date', 'categories']
  about_us = '<p>PenCoret adalah ruang baca digital yang menyajikan informasi terkini, fenomena viral di media sosial, serta fakta-fakta unik yang jarang dibahas secara mendalam dari sudut pandang yang berbeda.</p>'

  [Params.carousel]
    enable = true

  [Params.recent_posts]
    enable = true
    title = 'Artikel Terbaru'
    subtitle = 'Kumpulan tulisan terkini seputar tren viral, fakta unik, teknologi, dan gaya hidup.'
    hide_summary = false

  [Params.widgets]
    search = false
    categories = false
    tags = false
    
    [Params.author]
  name = "PenCoret"
  bio = "Ruang baca independen yang mengulas informasi terkini, tren viral, teknologi, dan fakta unik secara mendalam."
  avatar = "images/image_b36997e3.jpeg"
  

[taxonomies]
  category = 'categories'
  tag = 'tags'

# MENU ATAS (Beranda + Kategori)
[[menu.main]]
  name = 'Beranda'
  identifier = 'home'
  url = '/'
  weight = 1

[[menu.main]]
  name = 'Fakta Unik'
  identifier = 'fakta-unik'
  url = '/categories/fakta-unik/'
  weight = 2

[[menu.main]]
  name = 'Teknologi'
  identifier = 'teknologi'
  url = '/categories/teknologi/'
  weight = 3

[[menu.main]]
  name = 'Hiburan'
  identifier = 'hiburan'
  url = '/categories/hiburan/'
  weight = 4

[[menu.main]]
  name = 'Olahraga'
  identifier = 'olahraga'
  url = '/categories/olahraga/'
  weight = 5

[[menu.main]]
  name = 'Gaya Hidup'
  identifier = 'gaya-hidup'
  url = '/categories/gaya-hidup/'
  weight = 6

# MENU BAWAH / FOOTER
[[menu.footer]]
  name = 'Kontak'
  url = '/contact/'
  weight = 1

[[menu.footer]]
  name = 'Kebijakan Privasi'
  url = '/privacy-policy/'
  weight = 2

[[menu.footer]]
  name = 'Tentang Kami'
  url = '/about/'
  weight = 3

[[menu.footer]]
  name = 'Disclaimer'
  url = '/disclaimer/'
  weight = 4

[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = 'categories'
    weight = 100
  [[related.indices]]
    name = 'tags'
    weight = 80
  [[related.indices]]
    name = 'date'
    weight = 10
