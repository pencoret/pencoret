baseURL = 'https://pencoret.my.id'
languageCode = 'id-id'
title = 'PenCoret'
theme = 'hugo-universal-theme'
summaryLength = 35

[permalinks]
  blog = "/:slug/"

[Params]
  description = "Informasi Terkini, Tren Viral, dan Fakta Unik"
  copyright = "PenCoret"
  style = "default"
  mainSections = ["blog"]
  date_format = "02 January 2006"
  logo = "images/image_dacac6d.jpeg"
  logo_small = "images/image_b36997e3.jpeg"
  about_us = "<p>PenCoret adalah ruang baca digital yang menyajikan informasi terkini, fenomena viral di media sosial, serta fakta-fakta unik yang jarang dibahas secara mendalam.</p>"

  [Params.recent_posts]
    enable = true
    title = "Artikel Terbaru"
    subtitle = "Kumpulan tulisan terkini seputar tren viral, fakta unik, teknologi, dan gaya hidup."
    hide_summary = false

  [Params.widgets]
    search = false
    categories = false
    tags = false

