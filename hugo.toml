baseURL = 'https://pencoret.my.id'
languageCode = 'id-id'
title = 'PenCoret'
theme = 'mainroad'
summaryLength = 35
enableRobotsTXT = true
timeZone = 'Asia/Jakarta'

[sitemap]
  changefreq = 'hourly'
  filename = 'sitemap.xml'
  priority = 0.8

[permalinks]
  blog = '/:slug/'

[imaging]
  quality = 85
  resampleFilter = 'lanczos'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[Params]
  customCSS = ["css/custom.css"]
  customJS = ["js/custom.js"]
  description = 'Ruang Baca Terkini, Tren Viral dan Fakta Unik'
  keywords = ['berita terkini', 'tren viral', 'fakta unik', 'teknologi', 'hiburan', 'olahraga']
  copyright = 'PenCoret'
  style = 'default'
  mainSections = ['blog']
  date_format = '02 January 2006'
  logo = 'images/image_b36997e3.jpeg'
  logo_small = 'images/image_b36997e3.jpeg'
  images = ['images/image_d634cfff.jpg']
  opengraph = true
  twitter_cards = true
  schema = true
  post_meta = ['author', 'date', 'categories']
  about_us = '<p>PenCoret adalah ruang baca digital yang menyajikan informasi terkini, fenomena viral di media sosial, serta fakta-fakta unik yang jarang dibahas secara mendalam dari sudut pandang yang berbeda.</p>'

  [Params.carousel]
    enable = true

  [Params.recent_posts]
    enable = true
    title = 'Artikel Terbaru'
    subtitle = 'Kumpulan tulisan terkini seputar tren viral, fakta unik, teknologi, dan gaya hidup.'
    hide_summary = false

  [Params.widgets]
    search = false
    categories = false
    tags = false

[taxonomies]
  category = 'categories'
  tag = 'tags'
 
[[menu.main]]
  name = 'Beranda'
  identifier = 'home'
  url = '/'
  weight = 1

[[menu.main]]
  name = 'Tentang Kami'
  identifier = 'about'
  url = '/about/'
  weight = 2

[[menu.main]]
  name = 'Kontak'
  identifier = 'contact'
  url = '/contact/'
  weight = 3

[[menu.main]]
  name = 'Kebijakan Privasi'
  identifier = 'privacy'
  url = '/privacy-policy/'
  weight = 4

[[menu.main]]
  name = 'Disclaimer'
  identifier = 'disclaimer'
  url = '/disclaimer/'
  weight = 5
