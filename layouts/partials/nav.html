<!-- Pita Pencarian Biru Tua Full Kiri-Kanan di Paling Atas -->
<div class="pencoret-search-wrap">
  <form class="pencoret-search-form" action="{{ "search" | relURL }}" method="get">
    <input type="search" name="q" class="pencoret-search-input" placeholder="Cari artikel atau topik di PenCoret..." aria-label="Cari artikel" required>
    <button type="submit" class="pencoret-search-btn">Cari</button>
  </form>
</div>

<header class="navbar-affixed-top" data-spy="affix" data-offset-top="62" style="margin: 0 !important; padding: 0 !important; min-height: 0 !important; background: transparent !important;">
    <div class="navbar navbar-default yamm" role="navigation" id="navbar" style="display: none !important;">
        <div class="container" style="padding: 0 !important; margin: 0 !important;">
            <div class="navbar-collapse collapse" id="navigation">
                <ul class="nav navbar-nav navbar-right">
                  {{ range .Site.Menus.main }}
                    <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                  {{ end }}
                </ul>
            </div>
        </div>
    </div>

    <!-- Baris Kategori Tipis 1 Baris Mendatar & Bisa Di-slide -->
    <div class="kat-strip">
        <div class="container">
            <div class="kat-scroll">
                <a href="/categories/fakta-unik/">Fakta Unik</a>
                <a href="/categories/teknologi--digital/">Teknologi & Digital</a>
                <a href="/categories/gaya-hidup/">Gaya Hidup</a>
                <a href="/categories/bisnis--cuan/">Bisnis & Cuan</a>
            </div>
        </div>
    </div>
</header>

<style>
  /* 1. Pita Kolom Pencarian Biru Tua Penuh Kiri-Kanan */
  .pencoret-search-wrap {
    width: 100% !important;
    max-width: 100% !important;

    padding: 8px 14px !important;
    margin: 0 !important;

  }

    border-radius: 999px !important;
    padding: 3px 4px 3px 16px !important;
    box-sizing: border-box !important;
  }

  .pencoret-search-input {
    flex: 1 !important;
    width: 100% !important;
    border: none !important;

    color: #111827 !important;
    font-size: 13.5px !important;
    line-height: 1.4 !important;

  }

    padding: 6px 18px !important;

  }

  .pencoret-search-form .pencoret-search-btn:hover {

  /* 2. Menghapus ruang kosong & menipiskan garis hijau tosca */
  .navbar-affixed-top, #navbar, #navbar .container {
