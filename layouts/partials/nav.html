<header class="navbar-affixed-top" data-spy="affix" data-offset-top="62">
    <div class="navbar navbar-default yamm" role="navigation" id="navbar" style="margin-bottom: 0; border-bottom: none;">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand home" href="{{ "/" | relLangURL }}" style="padding: 12px 15px; height: auto;">
                    <span style="font-weight: 800; font-size: 18px; color: #222; letter-spacing: -0.3px;">Selamat Datang di {{ .Site.Title }}</span>
                </a>
                <div class="navbar-buttons">
                    <button type="button" class="navbar-toggle btn-template-main" data-toggle="collapse" data-target="#navigation" style="margin-top: 8px; margin-bottom: 8px;">
                        <span class="sr-only">Toggle Navigation</span>
                        <i class="fas fa-align-justify"></i>
                    </button>
                </div>
            </div>

            <div class="navbar-collapse collapse" id="navigation">
                <ul class="nav navbar-nav navbar-right">
                  {{ range .Site.Menus.main }}
                    <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                  {{ end }}
                </ul>
            </div>
        </div>
    </div>

    <!-- Baris Kategori Tipis 1 Baris Mendatar & Bisa Di-slide -->
    <div class="kat-strip">
        <div class="container">
            <div class="kat-scroll">
                <a href="/categories/viral--tren/">Viral & Tren</a>
                <a href="/categories/fakta-unik/">Fakta Unik</a>
                <a href="/categories/teknologi--digital/">Teknologi & Digital</a>
                <a href="/categories/gaya-hidup/">Gaya Hidup</a>
                <a href="/categories/bisnis--cuan/">Bisnis & Cuan</a>
                <a href="/categories/opini--cerita/">Opini & Cerita</a>
            </div>
        </div>
    </div>
</header>

<style>
  .kat-strip {
    background-color: #f8f9fa;
    border-top: 1px solid #e7e7e7;
    border-bottom: 1px solid #e7e7e7;
    padding: 4px 0;
  }
  .kat-scroll {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    gap: 6px;
    padding: 2px 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .kat-scroll::-webkit-scrollbar {
    display: none;
  }
  .kat-scroll a {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: #333333;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    padding: 3px 10px;
    border-radius: 14px;
    text-decoration: none;
    flex-shrink: 0;
  }
  .kat-scroll a:hover, .kat-scroll a:active {
    background-color: #38a7bb;
    color: #ffffff;
    border-color: #38a7bb;
  }
</style>
