<style>
  .baris-kategori {
    background-color: #f8f9fa;
    border-top: 1px solid #e7e7e7;
    border-bottom: 1px solid #e7e7e7;
    padding: 10px 0;
    text-align: center;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .baris-kategori::-webkit-scrollbar {
    display: none;
  }
  .baris-kategori a {
    display: inline-block;
    color: #333333;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    padding: 6px 14px;
    margin: 0 3px;
    border-radius: 20px;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .baris-kategori a:hover {
    background-color: #38a7bb;
    color: #ffffff;
  }
</style>

<script>
  $(document).ready(function() {
    var menuKategori = `
      <div class="baris-kategori">
        <div class="container">
          <a href="/">Beranda</a>
          <a href="/categories/viral--tren/">Viral & Tren</a>
          <a href="/categories/fakta-unik/">Fakta Unik</a>
          <a href="/categories/teknologi--digital/">Teknologi & Digital</a>
          <a href="/categories/gaya-hidup/">Gaya Hidup</a>
          <a href="/categories/bisnis--cuan/">Bisnis & Cuan</a>
          <a href="/categories/opini--cerita/">Opini & Cerita</a>
        </div>
      </div>
    `;
    $("header").after(menuKategori);
  });
</script>
