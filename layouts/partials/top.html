<style>
  @keyframes penaEstetik {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-3px) rotate(-4deg);
    }
    75% {
      transform: translateY(2px) rotate(3deg);
    }
  }

  /* BARIS LOGO DI DEPAN BANNER & BANNER GESER KE KANAN */
  .header-logo-banner-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 8px 0;
  }

  .front-logo-link {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .logo-animasi-estetik {
    width: 48px;
    height: 48px;
    object-fit: contain;
    mix-blend-mode: multiply;
    background: transparent;
    animation: penaEstetik 3.8s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
    display: block;
  }

  .front-logo-link:hover .logo-animasi-estetik,
  .front-logo-link:active .logo-animasi-estetik {
    animation-play-state: paused;
    transform: scale(1.15) rotate(-6deg);
  }

  /* BANNER DIGESER KE KANAN SEDIKIT */
  .banner-shifted-right {
    flex-grow: 1;
    margin-left: 6px;
    overflow: hidden;
    border-radius: 8px;
  }

  .banner-shifted-right img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>

<div class="global-top-wrap">
  <div class="container">
    <div class="header-logo-banner-row">
      <!-- LOGO TRANSPARAN DI DEPAN BANNER -->
      <a href="{{ "/" | relURL }}" class="front-logo-link" title="Beranda {{ .Site.Title }}">
        <img src="{{ "/images/image_d634cfff.jpg" | relURL }}" alt="Logo {{ .Site.Title }}" width="48" height="48" class="logo-animasi-estetik">
      </a>

      <!-- BANNER UTAMA GESER KE KANAN -->
      <div class="banner-shifted-right">
        <a href="{{ "/" | relURL }}" class="global-top-banner" title="Kembali ke Beranda PenCoret">
          <img src="{{ "/images/image_dacac6d.jpeg" | relURL }}" alt="{{ .Site.Title }}">
        </a>
      </div>
    </div>

    <!-- RUNNING TEXT ATAS -->
    <div class="global-running-bar">
      <div class="global-running-text">
        SELAMAT DATANG & MEMBACA | Terima kasih telah meluangkan waktu untuk berkunjung. Jangan lupa tinggalkan kritik dan saran, serta pendapat Anda di kolom komentar bawah!
      </div>
    </div>
  </div>
</div>
