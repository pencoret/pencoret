<style>
  .banner-box-relative { position: relative !important; }

  /* ANIMASI ESTETIK LOGO KECIL (MENGAMBANG & GOYANG HALUS SEPERTI PENA) */
  @keyframes penaEstetik {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-2.5px) rotate(-4deg);
    }
    75% {
      transform: translateY(1.5px) rotate(3deg);
    }
  }

  .logo-animasi-estetik {
    width: 30px;
    height: 30px;
    object-fit: contain;
    mix-blend-mode: multiply;
    background: transparent;
    animation: penaEstetik 3.8s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
  }

  .top-mini-logo a:hover .logo-animasi-estetik,
  .top-mini-logo a:active .logo-animasi-estetik {
    animation-play-state: paused;
    transform: scale(1.18) rotate(-6deg);
  }
  
  /* MENU TITIK 3 MENGAMBANG PAS DI BAWAH TOMBOL DI LAYAR HP */
  @media (max-width: 767px) {
    #navigation {
      position: absolute !important;
      top: 46px !important;
      right: 12px !important;
      width: 210px !important;
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 10px !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
      z-index: 9999 !important;
      padding: 6px 0 !important;
    }
    #navigation ul, #navigation .nav {
      display: flex !important;
      flex-direction: column !important;
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }
    #navigation li {
      border-bottom: 1px solid #f1f5f9 !important;
      width: 100% !important;
    }
    #navigation li:last-child { border-bottom: none !important; }
    #navigation a {
      display: block !important;
      padding: 10px 16px !important;
      color: #1a2536 !important;
      font-size: 13.5px !important;
      font-weight: 700 !important;
      text-decoration: none !important;
      text-align: left !important;
    }
    #navigation a:hover {
      background: #f4f6f8 !important;
      color: #38a7bb !important;
    }
  }
</style>

<div class="global-top-wrap">
  <div class="container" style="position: relative;">
    <!-- BARIS LOGO KECIL TRANSPARAN + ANIMASI ESTETIK DI POJOK ATAS KIRI -->
    <div class="top-mini-logo" style="display: flex; align-items: center; padding: 6px 2px;">
      <a href="{{ "/" | relURL }}" title="Beranda {{ .Site.Title }}" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
        <img src="{{ "/images/image_d634cfff.jpg" | relURL }}" alt="Logo {{ .Site.Title }}" width="30" height="30" class="logo-animasi-estetik">
        <span style="font-size: 16.5px; font-weight: 800; color: #1a2536; letter-spacing: -0.3px;">{{ .Site.Title }}</span>
      </a>
    </div>

    <!-- BANNER UTAMA & TOMBOL MENU TITIK TIGA -->
    <div class="banner-box-relative">
      <a href="{{ "/" | relURL }}" class="global-top-banner" title="Kembali ke Beranda PenCoret">
        <img src="{{ "/images/image_dacac6d.jpeg" | relURL }}" alt="{{ .Site.Title }}">
      </a>
      <button type="button" class="banner-dots-btn" data-toggle="collapse" data-target="#navigation" aria-label="Buka Menu">
        ⋮
      </button>
    </div>

    <!-- RUNNING TEXT ATAS -->
    <div class="global-running-bar">
      <div class="global-running-text">
        SELAMAT DATANG & MEMBACA | Terima kasih telah meluangkan waktu untuk berkunjung. Jangan lupa tinggalkan kritik dan saran, serta pendapat Anda di kolom komentar bawah!
      </div>
    </div>
  </div>
</div>
