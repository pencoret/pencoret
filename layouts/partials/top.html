<style>
  /* HILANGKAN GARIS HIJAU TOSCA BAWAAN DI PALING ATAS HALAMAN */
  body, #all, #top {
    border-top: none !important;
  }

  @keyframes penaEstetik {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-3.5px) rotate(-4deg);
    }
    75% {
      transform: translateY(2px) rotate(3deg);
    }
  }

  .global-top-wrap {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden;
  }

  .banner-box-relative {
    position: relative !important;
    width: 100% !important;
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* LOGO TRANSPARAN MENIMPA DI POJOK KIRI ATAS BANNER */
  .logo-overlay-banner {
    position: absolute !important;
    top: 6px !important;
    left: 10px !important;
    z-index: 20 !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .logo-animasi-estetik {
    width: 56px;
    height: 56px;
    object-fit: contain;
    background: transparent !important;
    animation: penaEstetik 3.8s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
    display: block;
  }

  .logo-overlay-banner:hover .logo-animasi-estetik,
  .logo-overlay-banner:active .logo-animasi-estetik {
    animation-play-state: paused;
    transform: scale(1.15) rotate(-6deg);
  }

  /* TOMBOL TEMA TEPAT DI BAWAH LOGO ANIMASI (MASIH DI DALAM BANNER) */
  .banner-theme-btn {
    position: absolute !important;
    top: 66px !important;
    left: 10px !important;
    z-index: 25 !important;
    padding: 3px 9px;
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 14px;
    background: rgba(26, 37, 54, 0.88);
    color: #f4d08c !important;
    border: 1px solid rgba(255, 255, 255, 0.4);
    cursor: pointer;
    backdrop-filter: blur(4px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: all 0.25s ease;
    line-height: 1.2;
  }

  .banner-theme-btn:hover {
    background: #38a7bb;
    color: #ffffff !important;
  }

  /* RUNNING TEXT + 1 GARIS HIJAU TOSCA FULL WIDTH DI BAWAHNYA */
  .global-running-bar {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    border-radius: 0 !important;
    border-top: none !important;
    border-bottom: 3.5px solid #38a7bb !important;
    box-sizing: border-box !important;
  }
</style>

<div class="global-top-wrap">
  <div class="banner-box-relative">
    <!-- LOGO PNG TRANSPARAN MENIMPA DI DEPAN BANNER -->
    <a href="{{ "/" | relURL }}" class="logo-overlay-banner" title="Beranda {{ .Site.Title }}">
      <img src="{{ "/images/logo-transparan.png" | relURL }}" alt="Logo {{ .Site.Title }}" width="56" height="56" class="logo-animasi-estetik">
    </a>

    <!-- TOMBOL TEMA TERANG / GELAP DI BAWAH LOGO -->
    <button type="button" id="theme-toggle" class="banner-theme-btn" aria-label="Ganti Tema">
      <i class="fas fa-moon"></i> Gelap
    </button>

    <!-- BANNER UTAMA ASLI -->
    <a href="{{ "/" | relURL }}" class="global-top-banner" title="Kembali ke Beranda PenCoret">
      <img src="{{ "/images/image_dacac6d.jpeg" | relURL }}" alt="{{ .Site.Title }}">
    </a>
  </div>

  <div class="global-running-bar">
    <div class="global-running-text">
      SELAMAT DATANG & MEMBACA | Terima kasih telah meluangkan waktu untuk berkunjung. Jangan lupa tinggalkan kritik dan saran, serta pendapat Anda di kolom komentar bawah!
    </div>
  </div>
</div>
