<style>
  @keyframes penaEstetik {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-3.5px) rotate(-4deg);
    }
    75% {
      transform: translateY(2px) rotate(3deg);
    }
  }

  /* RESET TOTAL PEMBUNGKUS ATAS AGAR TIDAK ADA GARIS PENDEK & LOGO PRESISI */
  .global-top-wrap {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    display: block !important;
    overflow: hidden !important;
  }

  .global-top-wrap .banner-box-relative {
    position: relative !important;
    width: 100% !important;
    height: 110px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    overflow: hidden !important;
    display: block !important;
  }

  @media (min-width: 768px) {
    .global-top-wrap .banner-box-relative {
      height: 165px !important;
    }
  }

  /* LOGO TRANSPARAN MENIMPA DI DEPAN BANNER */
  .global-top-wrap .logo-overlay-banner {
    position: absolute !important;
    top: 6px !important;
    left: 10px !important;
    z-index: 30 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    text-decoration: none !important;
    border: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .global-top-wrap .logo-animasi-estetik {
    width: 56px !important;
    height: 56px !important;
    object-fit: contain !important;
    background: transparent !important;
    animation: penaEstetik 3.8s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
    display: block !important;
  }

  /* TOMBOL TEMA TEPAT DI BAWAH LOGO ANIMASI (DI DALAM BANNER) */
  .global-top-wrap .banner-theme-btn {
    position: absolute !important;
    top: 66px !important;
    left: 10px !important;
    z-index: 35 !important;
    padding: 3px 9px !important;
    font-size: 10.5px !important;
    font-weight: 700 !important;
    border-radius: 14px !important;
    background: rgba(26, 37, 54, 0.88) !important;
    color: #f4d08c !important;
    border: 1px solid rgba(255, 255, 255, 0.4) !important;
    cursor: pointer !important;
    backdrop-filter: blur(4px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
    line-height: 1.2 !important;
    margin: 0 !important;
  }

  /* BANNER UTAMA FULL LEBAR */
  .global-top-wrap .global-top-banner {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }

  .global-top-wrap .global-top-banner img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center !important;
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }

  /* PITA RUNNING TEXT + 1 GARIS HIJAU TOSCA FULL WIDTH DI BAWAHNYA */
  .global-top-wrap .global-running-bar {
    width: 100% !important;
    max-width: 100% !important;
    height: 22px !important;
    line-height: 22px !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #1a2536 !important;
    color: #f4d08c !important;
    font-size: 11.5px !important;
    font-weight: 800 !important;
    display: flex !important;
    align-items: center !important;
    overflow: hidden !important;
    white-space: nowrap !important;
    border-top: none !important;
    border-left: none !important;
    border-right: none !important;
    border-bottom: 4px solid #38a7bb !important;
    border-radius: 0 !important;
    box-sizing: border-box !important;
  }

  .global-top-wrap .global-running-text {
    display: inline-block !important;
    padding-left: 100% !important;
    animation: jalanGlobal 16s linear infinite !important;
  }
</style>

<div class="global-top-wrap">
  <div class="banner-box-relative">
    <a href="{{ "/" | relURL }}" class="logo-overlay-banner" title="Beranda {{ .Site.Title }}">
      <img src="{{ "/images/logo-transparan.png" | relURL }}" alt="Logo {{ .Site.Title }}" width="56" height="56" class="logo-animasi-estetik">
    </a>

    <button type="button" id="theme-toggle" class="banner-theme-btn" aria-label="Ganti Tema">
      <i class="fas fa-moon"></i> Gelap
    </button>

    <a href="{{ "/" | relURL }}" class="global-top-banner" title="Kembali ke Beranda PenCoret">
      <img src="{{ "/images/image_dacac6d.jpeg" | relURL }}" alt="{{ .Site.Title }}">
    </a>
  </div>

  <div class="global-running-bar">
    <div class="global-running-text">
      SELAMAT DATANG & MEMBACA | Terima kasih telah meluangkan waktu untuk berkunjung. Jangan lupa tinggalkan kritik dan saran, serta pendapat Anda di kolom komentar bawah!
    </div>
  </div>
</div>
