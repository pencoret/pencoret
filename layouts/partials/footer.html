<script>
  document.addEventListener("DOMContentLoaded", function () {
    const namaWorker = "hitung-klik";
    const akunWorker = "coretpen4";
    const workerUrl = `https://${hitung-klik}.${coretpen4}.workers.dev`;
    const slug = encodeURIComponent(window.location.pathname || "/");
    const counterEl = document.getElementById("view-counter");

    fetch(`${https://hitung-klik.coretpen4.workers.dev}?slug=${slug}`, {
      method: "POST"
    })
      .then(res => res.json())
      .then(data => {
        if (data && data.views !== undefined) {
          counterEl.textContent = data.views.toLocaleString("id-ID");
        } else {
          counterEl.textContent = "1";
        }
      })
      .catch(() => {
        counterEl.textContent = "1";
      });
  });
</script>
