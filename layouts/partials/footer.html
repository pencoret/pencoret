<script>
  document.addEventListener("DOMContentLoaded", function () {
    const workerUrl = "https://workers.dev";
    const slug = encodeURIComponent(window.location.pathname || "/");
    const counterEl = document.getElementById("view-counter");

    fetch(`${workerUrl}?slug=${slug}`, {
      method: "POST"
    })
      .then(res => res.json())
      .then(data => {
        if (data && data.views !== undefined) {
          counterEl.textContent = data.views.toLocaleString("id-ID");
        } else {
          counterEl.textContent = "1";
        }
      })
      .catch(() => {
        counterEl.textContent = "1";
      });
  });
</script>
