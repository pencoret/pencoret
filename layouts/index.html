<!DOCTYPE html>
<html lang="id">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5990589807311817"
     crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W8M8KC6Q"></script>

  function gtag(){dataLayer.push(arguments);}

  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  {{- $ogImg := .Params.image | default .Params.banner | default .Params.thumbnail | default "/images/image_d634cfff.jpg" -}}
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ $ogImg | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:image" content="{{ $ogImg | absURL }}">

  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="icon" type="image/png" sizes="48x48" href="{{ "/images/logo-transparan.png" | relURL }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ "/images/logo-transparan.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "/images/logo-transparan.png" | relURL }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "PenCoret",
        "alternateName": ["pencoret.web.id", "Ruang Baca PenCoret"],
        "url": "https://pencoret.web.id"
      },
      {
        "@type": "Organization",
        "name": "PenCoret",
        "url": "https://pencoret.web.id",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ "/images/logo-transparan.png" | absURL }}"
        }
      }
    ]
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #333; margin: 0; }

    .top-search-wrap {
      width: 100%;
      background: #1a2536;
      padding: 8px 12px;
    }
    .top-search-form {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 20px;
      padding: 3px 6px 3px 14px;
      border: 1px solid #38a7bb;
    }
    .top-search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      color: #222;
      background: transparent;
      padding: 5px 0;
    }
    .top-search-btn {
      background: #38a7bb;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .top-search-btn:hover { background: #2c8a9b; }

    .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0; }
    .home-wrap { padding-bottom: 35px; }

    .sec-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 14px 0 8px;
      padding: 0;
    }
    .sec-label {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      color: #222;
      border-left: 4px solid #38a7bb;
      padding-left: 10px;
      margin: 0;
    }

    .nav-dropdown-select {
      appearance: none;
      -webkit-appearance: none;
      background-color: #38a7bb;
      background-image: none;
      color: #ffffff;
      border: 1px solid #38a7bb;
      padding: 5px 14px;
      margin-right: 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      width: auto;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
    }
    .nav-dropdown-select:hover, .nav-dropdown-select:focus {
      background-color: #2c8a9b;
      border-color: #2c8a9b;
    }
    .nav-dropdown-select option {
      background-color: #ffffff;
      color: #222222;
      font-weight: 600;
      text-align: left;
    }

    @keyframes penaEstetik {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3.5px) rotate(-4deg); }
      75% { transform: translateY(2px) rotate(3deg); }
    }
    .home-logo-overlay {
      position: absolute;
      top: 8px;
      left: 12px;
      z-index: 20;
      display: inline-flex;
      text-decoration: none;
    }
    .home-logo-animasi {
      width: 56px;
      height: 56px;
      object-fit: contain;
      background: transparent !important;
      animation: penaEstetik 3.8s ease-in-out infinite;
      transform-origin: bottom center;
      display: block;
    }

    .cat-menu-bar {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 8px;
      margin: 10px 0 12px;
      padding: 2px 0 6px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .cat-menu-bar::-webkit-scrollbar { display: none; }
    .cat-menu-btn {
      flex-shrink: 0;
      white-space: nowrap;
      background: #f4f6f8;
      color: #222 !important;
      border: 1px solid #dce1e7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none !important;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .cat-menu-btn:hover { background: #38a7bb; color: #fff !important; border-color: #38a7bb; }

    .pop-slider { position: relative; overflow: hidden; border-radius: 0; background: #111; margin-top: 6px; }
    .pop-track { display: flex; transition: transform 0.45s ease; will-change: transform; }
    .pop-slide { min-width: 100%; position: relative; height: 240px; }
    .pop-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.78; }
    .pop-overlay { position: absolute; bottom: 0; inset-inline: 0; padding: 18px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.92)); }
    .pop-overlay h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.35; }
    .pop-overlay h2 a { color: #fff; text-decoration: none; }
    .pop-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.55); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; z-index: 5; }
    .pop-prev { left: 10px; } .pop-next { right: 10px; }

    .mini-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 0 14px;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .mini-row::-webkit-scrollbar { display: none; }

    .mini-card {
      width: 175px;
      flex-shrink: 0;
      scroll-snap-align: start;
      border: 1px solid #edf0f3;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .mini-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(56, 167, 187, 0.14);
      border-color: #bfe3ea;
    }

    .mini-card > a { display: block; overflow: hidden; }
    .mini-card img { width: 100%; height: 105px; object-fit: cover; display: block; transition: transform 0.35s ease; }
    .mini-card:hover img { transform: scale(1.05); }

    .mini-card-body { padding: 10px 12px 12px; }
    .mini-card-body h4 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mini-card-body h4 a { color: #222; text-decoration: none; transition: color 0.2s ease; }
    .mini-card:hover .mini-card-body h4 a { color: #38a7bb; }

    .latest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; padding: 0; }
    .big-card { border: 1px solid #eaeaea; border-radius: 6px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
    .big-card img { width: 100%; height: 115px; object-fit: cover; }
    .big-card-body { padding: 9px 10px; flex-grow: 1; }
    .big-cat { font-size: 10px; font-weight: 700; color: #38a7bb; text-transform: uppercase; }
    .big-card-body h3 { margin: 3px 0 5px; font-size: 13.5px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .big-card-body h3 a { color: #222; text-decoration: none; }
    .big-meta { font-size: 10.5px; color: #777; }

    .all-post-box { margin-top: 16px; text-align: center; padding: 0 12px; }
    .btn-all-post { display: inline-flex; align-items: center; justify-content: center; width: 100%; max-width: 320px; background: #38a7bb; color: #fff !important; font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: 6px; text-decoration: none !important; transition: 0.2s; }
    .btn-all-post:hover { background: #2c8a9b; }
    .site-footer { background: #1a2536; color: #ccc; padding: 18px 0 0; margin-top: 36px; font-size: 13px; }
    .footer-top-flex { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding: 0 12px; }
    .footer-logo img { max-height: 38px; display: block; background: transparent; }
    .footer-nav { display: grid; grid-template-columns: repeat(2, auto); gap: 6px; justify-content: end; text-align: center; }
    .footer-btn { background: rgba(255,255,255,0.1); color: #fff !important; border: 1px solid rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 14px; font-size: 11px; font-weight: 600; text-decoration: none !important; white-space: nowrap; transition: 0.2s; }
    .footer-btn:hover { background: #38a7bb; border-color: #38a7bb; }
    .footer-running-bottom { background: #38a7bb; color: #ffffff; padding: 9px 0; font-size: 13px; font-weight: 600; overflow: hidden; }

    @keyframes jalanTeks { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }
    @media (min-width: 768px) {
      .pop-slide { height: 360px; } .pop-overlay h2 { font-size: 24px; }
      .latest-grid { gap: 14px; } .big-card img { height: 185px; } .big-card-body h3 { font-size: 16px; }
      .mini-card { width: 225px; } .mini-card img { height: 135px; }
    }

    .home-theme-btn,
    .sec-header-row .home-theme-btn {
      position: static !important;
      top: auto !important;
      right: auto !important;
      left: auto !important;
      bottom: auto !important;
      margin: 0 auto !important;
      flex-shrink: 0;
      z-index: 25;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      background: rgba(26, 37, 54, 0.85);
      color: #f4d08c !important;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      line-height: 1.2;
      transition: all 0.25s ease;
    }
    .home-theme-btn:hover,
    .sec-header-row .home-theme-btn:hover {
      background: #38a7bb;
      color: #ffffff !important;
    }

    html[data-theme="dark"] body,
    html[data-theme="dark"] .home-wrap { background-color: #121212 !important; color: #e4e4e4 !important; }
    html[data-theme="dark"] .sec-label,
    html[data-theme="dark"] .mini-card-body h4 a,
    html[data-theme="dark"] .big-card-body h3 a { color: #e4e4e4 !important; }
    html[data-theme="dark"] .big-meta { color: #aaaaaa !important; }
    html[data-theme="dark"] .cat-menu-btn,
    html[data-theme="dark"] .mini-card,
    html[data-theme="dark"] .big-card { background-color: #1e1e1e !important; border-color: #333333 !important; color: #e4e4e4 !important; }
    html[data-theme="dark"] .cat-menu-btn:hover { background-color: #38a7bb !important; color: #ffffff !important; }

    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    iframe.goog-te-banner-frame,
    iframe.skiptranslate,
    iframe[id^=":"][class*="skiptranslate"],
    .VIpgJd-ZVi9od-ORHb-OEVmcd,
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
    body > .skiptranslate,
    #goog-gt-tt,
    .goog-te-balloon-frame {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      max-height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    html, body {
      top: 0px !important;
      margin-top: 0px !important;
      padding-top: 0px !important;
      position: static !important;
    }
  </style>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
