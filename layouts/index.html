<html lang="id">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  {{- $ogImg := .Params.image | default .Params.banner | default .Params.thumbnail | default "/images/image_d634cfff.jpg" -}}
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ $ogImg | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:image" content="{{ $ogImg | absURL }}">

  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.description }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="icon" type="image/png" sizes="48x48" href="{{ "/images/logo-transparan.png" | relURL }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ "/images/logo-transparan.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "/images/logo-transparan.png" | relURL }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "PenCoret",
        "alternateName": ["pencoret.web.id", "Ruang Baca PenCoret"],
        "url": "https://pencoret.web.id"
      },
      {
        "@type": "Organization",
        "name": "PenCoret",
        "url": "https://pencoret.web.id",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ "/images/logo-transparan.png" | absURL }}"
        }
      }
    ]
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #333; margin: 0; }

    .top-search-wrap {
      width: 100%;
      background: #1a2536;
      padding: 8px 12px;
    }
    .top-search-form {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 20px;
      padding: 3px 6px 3px 14px;
      border: 1px solid #38a7bb;
    }
    .top-search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      color: #222;
      background: transparent;
      padding: 5px 0;
    }
    .top-search-btn {
      background: #38a7bb;
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .top-search-btn:hover { background: #2c8a9b; }

    .container { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0; }
    .home-wrap { padding-bottom: 35px; }

    .sec-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 14px 0 8px;
      padding: 0;
    }
    .sec-label {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      color: #222;
      border-left: 4px solid #38a7bb;
      padding-left: 10px;
      margin: 0;
    }

    .nav-dropdown-select {
      appearance: none;
      -webkit-appearance: none;
      background-color: #38a7bb;
      background-image: none;
      color: #ffffff;
      border: 1px solid #38a7bb;
      padding: 5px 14px;
      margin-right: 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      width: auto;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
    }
    .nav-dropdown-select:hover, .nav-dropdown-select:focus {
      background-color: #2c8a9b;
      border-color: #2c8a9b;
    }
    .nav-dropdown-select option {
      background-color: #ffffff;
      color: #222222;
      font-weight: 600;
      text-align: left;
    }

    @keyframes penaEstetik {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3.5px) rotate(-4deg); }
      75% { transform: translateY(2px) rotate(3deg); }
    }
    .home-logo-overlay {
      position: absolute;
      top: 8px;
      left: 12px;
      z-index: 20;
      display: inline-flex;
      text-decoration: none;
    }
    .home-logo-animasi {
      width: 56px;
      height: 56px;
      object-fit: contain;
      background: transparent !important;
      animation: penaEstetik 3.8s ease-in-out infinite;
      transform-origin: bottom center;
      display: block;
    }

    .cat-menu-bar {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 8px;
      margin: 10px 0 12px;
      padding: 2px 0 6px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .cat-menu-bar::-webkit-scrollbar { display: none; }
    .cat-menu-btn {
      flex-shrink: 0;
      white-space: nowrap;
      background: #f4f6f8;
      color: #222 !important;
      border: 1px solid #dce1e7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none !important;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .cat-menu-btn:hover { background: #38a7bb; color: #fff !important; border-color: #38a7bb; }

    .pop-slider { position: relative; overflow: hidden; border-radius: 0; background: #111; margin-top: 6px; }
    .pop-track { display: flex; transition: transform 0.45s ease; will-change: transform; }
    .pop-slide { min-width: 100%; position: relative; height: 240px; }
    .pop-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.78; }
    .pop-overlay { position: absolute; bottom: 0; inset-inline: 0; padding: 18px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.92)); }
    .pop-overlay h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.35; }
    .pop-overlay h2 a { color: #fff; text-decoration: none; }
    .pop-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.55); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; z-index: 5; }
    .pop-prev { left: 10px; } .pop-next { right: 10px; }
