<header class="navbar-affixed-top" data-spy="affix" data-offset-top="62">
    <div class="navbar navbar-default yamm" role="navigation" id="navbar">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand home" href="{{ "/" | relLangURL }}">
                    <span style="font-weight: 800; font-size: 22px; color: #333; line-height: 50px;">{{ .Site.Title }}</span>
                </a>
                <div class="navbar-buttons">
                    <button type="button" class="navbar-toggle btn-template-main" data-toggle="collapse" data-target="#navigation">
                        <span class="sr-only">Toggle Navigation</span>
                        <i class="fas fa-align-justify"></i>
                    </button>
                </div>
            </div>

            <div class="navbar-collapse collapse" id="navigation">
                <ul class="nav navbar-nav navbar-right">
                  {{ range .Site.Menus.main }}
                  {{ if .HasChildren }}
                    <li class="dropdown">
                      <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">{{ .Name }} <span class="caret"></span></a>
                      <ul class="dropdown-menu">
                        {{ range .Children }}
                          <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                        {{ end }}
                      </ul>
                    </li>
                  {{ else }}
                    <li class="dropdown">
                      <a href="{{ .URL }}">{{ .Name }}</a>
                    </li>
                  {{ end }}
                  {{ end }}
                </ul>
            </div>
        </div>
    </div>

    <div style="background-color: #f8f9fa; border-top: 1px solid #e7e7e7; border-bottom: 1px solid #e7e7e7; padding: 8px 0; text-align: center; overflow-x: auto; white-space: nowrap;">
        <div class="container">
            <a href="/categories/viral--tren/" style="display: inline-block; color: #333; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 4px 12px; text-decoration: none;">Viral & Tren</a>
            <a href="/categories/fakta-unik/" style="display: inline-block; color: #333; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 4px 12px; text-decoration: none;">Fakta Unik</a>
            <a href="/categories/teknologi--digital/" style="display: inline-block; color: #333; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 4px 12px; text-decoration: none;">Teknologi & Digital</a>
            <a href="/categories/gaya-hidup/" style="display: inline-block; color: #333; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 4px 12px; text-decoration: none;">Gaya Hidup</a>
            <a href="/categories/bisnis--cuan/" style="display: inline-block; color: #333; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 4px 12px; text-decoration: none;">Bisnis & Cuan</a>
            <a href="/categories/opini--cerita/" style="display: inline-block; color: #333; font-weight: 600; font-size: 13px; text-transform: uppercase; padding: 4px 12px; text-decoration: none;">Opini & Cerita</a>
        </div>
    </div>
</header>
