<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

  <head>
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5990589807311817"
     crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W8M8KC6Q"></script>
<script>
  
    {{ partial "head.html" . }}

    <style>
      html, body {
        max-width: 100vw !important;
        overflow-x: hidden !important;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #222222;
      }

      .post-wrap {
        padding: 18px 0 44px;
        max-width: 820px;
        margin: 0 auto;
        position: relative;
      }

      /* SELA KANAN & KIRI YANG NYAMAN DIBACA DARI ATAS SAMPAI BAWAH */
      .above-title-bar,
      .post-title,
      .post-meta,
      .post-thumb,
      .post-body,
      .post-tags,
      .latest-bottom-box {
        padding-left: 18px !important;
        padding-right: 18px !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        box-sizing: border-box !important;
      }

      @media screen and (min-width: 768px) {
        .above-title-bar,
        .post-title,
        .post-meta,
        .post-thumb,
        .post-body,
        .post-tags,
        .latest-bottom-box {
          padding-left: 28px !important;
          padding-right: 28px !important;
        }
      }

      /* BARIS ATAS JUDUL: KATEGORI DI KIRI & TOMBOL TITIK TIGA DI KANAN */
      .above-title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        position: relative;
      }
      .post-cat {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        color: #38a7bb;
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 0.4px;
      }

      .title-dots-btn {
        background: #38a7bb;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        width: 32px;
        height: 32px;
        font-size: 19px;
        font-weight: 800;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(56, 167, 187, 0.3);
      }

      /* DROPDOWN MENU SAAT TOMBOL TITIK 3 DIKLIK */
      .title-dots-menu {
        display: none;
        position: absolute;
        top: 38px;
        right: 18px;
        width: 210px;
        background-color: #38a7bb;
        border: 1px solid #2e8f9f;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        z-index: 9999;
        padding: 6px 0;
      }
      .title-dots-menu.show { display: block; }
      .title-dots-menu a {
        display: block;
        padding: 9px 16px;
        color: #ffffff;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      }
      .title-dots-menu a:last-child { border-bottom: none; }
      .title-dots-menu a:hover { background: rgba(255, 255, 255, 0.16); }

      /* ELEMEN KONTEN ARTIKEL */
      .post-title {
        font-size: 23px;
        font-weight: 800;
        line-height: 1.35;
        color: #1a2536;
        margin-top: 0;
        margin-bottom: 10px;
      }
      .post-meta {
        font-size: 12px;
        color: #777;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #eee;
      }
      .post-thumb {
        margin-top: 0;
        margin-bottom: 20px;
      }
      .post-thumb img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
        border-radius: 10px;
      }
      .post-body {
        font-size: 16px;
        line-height: 1.8;
        color: #222;
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
      .post-body p {
        margin-top: 0;
        margin-bottom: 16px;
      }
      .post-body img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 16px 0;
      }
      .post-body h2 {
        font-size: 20px;
        font-weight: 700;
        color: #1a2536;
        margin: 28px 0 10px;
        line-height: 1.35;
      }
      .post-body h3 {
        font-size: 18px;
        font-weight: 700;
        color: #1a2536;
        margin: 24px 0 8px;
        line-height: 1.35;
      }
      .post-body ul, .post-body ol {
        padding-left: 20px;
        margin-bottom: 16px;
      }
      .post-body li {
        margin-bottom: 6px;
      }
      .post-body table {
        display: block;
        width: 100%;
        overflow-x: auto;
      }

      /* KOTAK BACA JUGA DI DALAM ARTIKEL (ARTIKEL TERKAIT) */
      .baca-juga-box {
        background: #f4f6f8;
        border-left: 4px solid #38a7bb;
        padding: 12px 16px;
        margin: 18px 0;
        border-radius: 0 8px 8px 0;
        font-size: 14.5px;
        line-height: 1.45;
      }
      .baca-juga-box strong { color: #1a2536; margin-right: 4px; }
      .baca-juga-box a { color: #38a7bb; font-weight: 700; text-decoration: none; }
      .baca-juga-box a:hover { text-decoration: underline; }

      /* TAG ARTIKEL */
      .post-tags {
        margin-top: 26px;
        padding-top: 14px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #666;
      }
      .post-tags a {
        display: inline-block;
        background: #f4f6f8;
        color: #333;
        padding: 4px 10px;
        border-radius: 15px;
        text-decoration: none;
        margin: 4px 4px 2px 0;
      }

      /* 5 DAFTAR JUDUL POSTINGAN TERBARU DI BAWAH */
      .latest-bottom-box {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 2px solid #f0f2f5;
      }
      .latest-bottom-title {
        font-size: 15px;
        font-weight: 800;
        text-transform: uppercase;
        color: #1a2536;
        border-left: 4px solid #38a7bb;
        padding-left: 10px;
        margin: 0 0 12px 0;
      }
      .latest-bottom-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .latest-bottom-list li {
        padding: 10px 0;
        border-bottom: 1px dashed #e2e8f0;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .latest-bottom-list li:last-child {
        border-bottom: none;
      }
      .latest-num {
        background: #38a7bb;
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        min-width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 2px;
        flex-shrink: 0;
      }
      .latest-bottom-list a {
        color: #1a2536;
        font-size: 14.5px;
        font-weight: 700;
        line-height: 1.4;
        text-decoration: none;
      }
      .latest-bottom-list a:hover {
        color: #38a7bb;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div id="all">
      {{- if templates.Exists "partials/top.html" -}}
        {{ partial "top.html" . }}
      {{- end -}}
      {{- if templates.Exists "partials/nav.html" -}}
        {{ partial "nav.html" . }}
      {{- end -}}

      <div id="content">
        <div class="container post-wrap">
          <article class="single-post">
            <!-- BARIS ATAS JUDUL: KATEGORI DI KIRI, TOMBOL TITIK TIGA DI KANAN -->
            <div class="above-title-bar">
              <div>
                {{ with .Params.categories }}
                  <a href="{{ "/categories/" | relURL }}{{ index . 0 | urlize }}/" class="post-cat">{{ index . 0 }}</a>
                {{ end }}
              </div>
              <div>
                <button type="button" class="title-dots-btn" onclick="document.getElementById('titleDotsDropdown').classList.toggle('show')" aria-label="Menu Kategori">
                  ⋮
                </button>
                <div id="titleDotsDropdown" class="title-dots-menu">
                  {{- range .Site.Menus.main }}
                    <a href="{{ .URL | relURL }}">{{ .Name }}</a>
                  {{- end }}
                </div>
              </div>
            </div>

            <h1 class="post-title">{{ .Title }}</h1>

            <div class="post-meta">
              Oleh: <strong>{{ .Params.author | default "PenCoret" }}</strong> • {{ .Date.Format "02 Jan 2006" }}
            </div>

            {{- $rawImg := .Params.banner | default .Params.image | default .Params.thumbnail -}}
            {{- if and (not $rawImg) .Params.images -}}
              {{- $rawImg = index .Params.images 0 -}}
            {{- end -}}

            {{- if $rawImg }}
              {{- $cleanPath := strings.TrimPrefix "/" $rawImg -}}
              {{- $res := resources.Get $cleanPath -}}
              {{- if not $res -}}
                {{- $res = resources.Get (printf "images/%s" (path.Base $cleanPath)) -}}
              {{- end -}}

              {{- $finalSrc := $rawImg | relURL -}}
              {{- if $res -}}
                {{- $webp := $res.Resize "1200x webp q85" -}}
                {{- $finalSrc = $webp.RelPermalink -}}
              {{- end -}}

              <figure class="post-thumb">
                <img src="{{ $finalSrc }}" alt="{{ .Params.banner_alt | default .Title }}" fetchpriority="high" style="width:100%; height:auto;">
                {{- with .Params.banner_caption -}}
                  <figcaption style="font-size:12px; color:#666; margin-top:6px; text-align:center;">{{ . }}</figcaption>
                {{- end -}}
              </figure>
            {{- end }}
