name: Pindah Gambar ke Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Rapikan dan pindahkan foto ke assets/images
        run: |
          mkdir -p assets/images
          mkdir -p static/images

          if [ -d ".static/images" ]; then
            git rm -f ".static/images/.gitkeep" 2>/dev/null || rm -f ".static/images/.gitkeep"
            for file in .static/images/*; do
              [ -f "$file" ] && git mv "$file" "assets/images/$(basename "$file")"
            done
          fi

          if [ -d "static/images" ]; then
            for file in static/images/*; do
              fname=$(basename "$file")
              if [ -f "$file" ] && [ "$fname" != "logo-transparan.png" ] && [ "$fname" != "image_dacac6d.jpeg" ] && [ "$fname" != "image_d634cfff.jpg" ]; then
                git mv "$file" "assets/images/$fname"
              fi
            done
          fi

          for aset in logo-transparan.png image_dacac6d.jpeg image_d634cfff.jpg; do
            if [ -f "assets/images/$aset" ]; then
              git mv "assets/images/$aset" "static/images/$aset"
            fi
          done

      - name: Simpan dan Push perubahan
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Pindah foto ke assets/images"
          git push
          
