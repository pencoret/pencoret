name: Optimasi Gambar SEO & Thumbnail Otomatis

on:
  push:
    paths:
      - 'static/images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow (Pengolah Gambar)
        run: pip install Pillow

      - name: Resize & Kompres Gambar di static/images
        run: |
          python3 -c '
          import os
          from PIL import Image, ImageOps

          folder = "static/images"
          OG_WIDTH = 1200
          OG_HEIGHT = 630
          MAX_CONTENT_WIDTH = 1200

          if os.path.exists(folder):
              for root, _, files in os.walk(folder):
                  for file in files:
                      if file.lower().endswith((".jpg", ".jpeg", ".png")):
                          path = os.path.join(root, file)
                          is_thumbnail = file.lower().startswith("thumb-") or "thumbs" in root.lower()

                          try:
                              with Image.open(path) as img:
                                  # 1. Aturan untuk Thumbnail Share Link (1200x630)
                                  if is_thumbnail:
                                      if os.path.getsize(path) < 250 * 1024 and img.width == OG_WIDTH and img.height == OG_HEIGHT:
                                          continue
                                      if img.mode in ("RGBA", "P"):
                                          img = img.convert("RGB")
                                      img = ImageOps.fit(img, (OG_WIDTH, OG_HEIGHT), Image.Resampling.LANCZOS)
                                      img.save(path, format="JPEG", quality=82, optimize=True)
                                      print(f"Thumbnail OG dioptimasi (1200x630): {path}")

                                  # 2. Aturan untuk Gambar Isi Artikel (Proporsional, Tanpa Potong)
                                  else:
                                      if os.path.getsize(path) < 250 * 1024 and img.width <= MAX_CONTENT_WIDTH:
                                          continue
                                      if img.width > MAX_CONTENT_WIDTH:
                                          ratio = MAX_CONTENT_WIDTH / float(img.width)
                                          new_height = int(float(img.height) * ratio)
                                          img = img.resize((MAX_CONTENT_WIDTH, new_height), Image.Resampling.LANCZOS)

                                      if file.lower().endswith(".png"):
                                          img.save(path, format="PNG", optimize=True)
                                      else:
                                          if img.mode in ("RGBA", "P"):
                                              img = img.convert("RGB")
                                          img.save(path, format="JPEG", quality=82, optimize=True)
                                      print(f"Gambar artikel dioptimasi (proporsional): {path}")

                          except Exception as e:
                              print(f"Gagal memproses {path}: {e}")
          '

      - name: Simpan Gambar Terkompresi ke GitHub
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add static/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "perf: optimasi ukuran & dimensi gambar SEO" && git push)
          
