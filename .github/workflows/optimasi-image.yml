name: Optimasi Gambar SEO Otomatis

on:
  push:
    paths:
      - 'static/images/**' # Hanya jalan saat ada gambar baru/diubah di static/images
  workflow_dispatch: # Bisa juga diklik manual untuk mengompres gambar lama

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow (Pengolah Gambar)
        run: pip install Pillow

      - name: Resize & Kompres Gambar di static/images
        run: |
          python3 -c '
          import os
          from PIL import Image, ImageOps

          folder = "static/images"
          MAX_WIDTH = 1200
          MAX_HEIGHT = 630

          if os.path.exists(folder):
              for root, _, files in os.walk(folder):
                  for file in files:
                      if file.lower().endswith((".jpg", ".jpeg", ".png")):
                          path = os.path.join(root, file)
                          try:
                              with Image.open(path) as img:
                                  # Lewati jika ukuran file sudah ringan (< 250 KB) dan dimensi sudah pas
                                  if os.path.getsize(path) < 250 * 1024 and img.width == MAX_WIDTH and img.height == MAX_HEIGHT:
                                      continue

                                  if img.mode in ("RGBA", "P"):
                                      img = img.convert("RGB")

                                  # Potong tengah & sesuaikan ke 1200x630 piksel tanpa gepeng
                                  img_resized = ImageOps.fit(img, (MAX_WIDTH, MAX_HEIGHT), Image.Resampling.LANCZOS)

                                  # Simpan ulang dengan kualitas 82% (ringan & tetap tajam)
                                  img_resized.save(path, format="JPEG", quality=82, optimize=True)
                                  print(f"Berhasil dioptimasi: {path}")
                          except Exception as e:
                              print(f"Gagal memproses {path}: {e}")
          '

      - name: Simpan Gambar Terkompresi ke GitHub
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add static/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "perf: optimasi ukuran & dimensi gambar SEO" && git push)
          
