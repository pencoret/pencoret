name: Hapus Kategori Otomatis

on:
  push:
    paths:
      - '.github/workflows/hapus-kategori.yml'

jobs:
  hapus-teks:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori
        uses: actions/checkout@v4

      - name: Hapus baris yang mengandung kategori
        run: |
          find . -type f -not -path '*/.git/*' -not -path '*/.github/*' -exec sed -i '/Viral & Tren/d; /Opini & Cerita/d' {} +

      - name: Simpan perubahan (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Hapus kategori Viral & Tren dan Opini & Cerita" || exit 0
          git push
