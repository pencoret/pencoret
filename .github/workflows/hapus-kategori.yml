name: Hapus Kategori Otomatis

on:
  workflow_dispatch: # Dijalankan manual lewat tombol di HP

jobs:
  hapus-teks:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori
        uses: actions/checkout@v4

      - name: Hapus teks kategori di semua file
        run: |
          find . -type f -not -path '*/.git/*' -not -path '*/.github/*' -exec sed -i 's/Viral & Tren//g; s/Opini & Cerita//g' {} +

      - name: Simpan perubahan (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Hapus kategori Viral & Tren dan Opini & Cerita" || exit 0
          git push
          
