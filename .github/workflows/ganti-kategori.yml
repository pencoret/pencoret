name: Ganti Kategori Otomatis
on:
  push:
    paths:
      - '.github/workflows/ganti-kategori.yml'

permissions:
  contents: write

jobs:
  replace-categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          find content/blog -type f -name "*.md" -exec sed -i 's/Viral & Tren/Fakta Unik/g' {} +
          find content/blog -type f -name "*.md" -exec sed -i 's/Opini & Cerita/Gaya Hidup/g' {} +
          git config --local user.email "bot@github.com"
          git config --local user.name "GitHub Bot"
          git add content/blog
          git diff --quiet && git diff --staged --quiet || (git commit -m "Rapikan kategori" && git push)
