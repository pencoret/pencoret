backend:
  name: github
  repo: si/pencoret
  branch: main
  base_url: https://pencoret.my.id
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Artikel Blog"
    folder: "content/post"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text", required: false }
      - { label: "Kategori", name: "categories", widget: "select", options: ["Viral & Tren", "Fakta Unik", "Teknologi & Digital", "Gaya Hidup", "Bisnis & Cuan", "Opini & Cerita"] }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Foto Utama", name: "banner", widget: "image", required: false }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }
